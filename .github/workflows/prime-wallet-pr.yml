name: Prime Wallet Pull Request Gate

on:
  pull_request:
    branches:
      - dev
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: prime-wallet-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_FASTLINK_API_URL: /api
      VITE_FASTLINK_ENVIRONMENT: SANDBOX
      VITE_FASTLINK_BUILD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact pull request commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Test when the branch contains tests
        shell: bash
        run: |
          if find . -path './node_modules' -prune -o -type f \( -name '*.test.*' -o -name '*.spec.*' \) -print -quit | grep -q .; then
            bun test
          else
            echo 'No test files exist on this baseline; continuing with type, audit, lint, and build gates.'
          fi

      - name: Run public contract adversarial matrices
        run: bun test src/lib/card-read-adversarial.test.ts src/lib/wallet-operation-adversarial.test.ts src/lib/card-transaction-adversarial.test.ts src/lib/card-transaction-pagination-adversarial.test.ts src/lib/card-transaction-detail-refresh-adversarial.test.ts src/lib/virtual-card-create-adversarial.test.ts src/lib/card-renew-adversarial.test.ts src/lib/card-replace-adversarial.test.ts src/lib/card-limits-mutation-adversarial.test.ts src/lib/wallet-transfer-mutation-adversarial.test.ts src/lib/wallet-transfer-account-state.test.ts src/lib/wallet-transfer-status-refresh-adversarial.test.ts src/lib/wallet-balance-summary-adversarial.test.ts src/lib/wallet-transaction-filter-adversarial.test.ts src/lib/wallet-transaction-refresh-adversarial.test.ts src/lib/wallet-transaction-selection-adversarial.test.ts src/lib/wallet-transaction-detail-refresh-adversarial.test.ts

      - name: Run Wallet transfer refresh integration safety in SANDBOX
        run: bun run test:transfer-refresh-integration:sandbox

      - name: Run Wallet transfer refresh integration safety in TEST
        run: bun run test:transfer-refresh-integration:test

      - name: Run Card history integration safety in SANDBOX
        run: bun run test:card-history-integration:sandbox

      - name: Run Card history integration safety in TEST
        run: bun run test:card-history-integration:test

      - name: Run mounted Card timeline safety in SANDBOX
        run: bun run test:card-timeline-mounted:sandbox

      - name: Run mounted Card timeline safety in TEST
        run: bun run test:card-timeline-mounted:test

      - name: Run Internal transfer integration safety in SANDBOX
        run: bun run test:internal-transfer-integration:sandbox

      - name: Run Internal transfer integration safety in TEST
        run: bun run test:internal-transfer-integration:test

      - name: Run mounted Internal transfer safety in SANDBOX
        run: bun run test:internal-transfer-mounted:sandbox

      - name: Run mounted Internal transfer safety in TEST
        run: bun run test:internal-transfer-mounted:test

      - name: Run Card history hook safety in SANDBOX
        run: bun run test:card-history-hook:sandbox

      - name: Run Card history hook safety in TEST
        run: bun run test:card-history-hook:test

      - name: Run mounted Wallet transaction filters in SANDBOX
        run: bun run test:wallet-history-filter-mounted:sandbox

      - name: Run mounted Wallet transaction filters in TEST
        run: bun run test:wallet-history-filter-mounted:test

      - name: Run mounted Wallet transaction history refresh in SANDBOX
        run: bun run test:wallet-history-refresh-mounted:sandbox

      - name: Run mounted Wallet transaction history refresh in TEST
        run: bun run test:wallet-history-refresh-mounted:test

      - name: Run mounted Wallet refreshed selection safety in SANDBOX
        run: bun run test:wallet-history-selection-mounted:sandbox

      - name: Run mounted Wallet refreshed selection safety in TEST
        run: bun run test:wallet-history-selection-mounted:test

      - name: Run mounted Wallet transaction detail refresh in SANDBOX
        run: bun run test:wallet-detail-refresh-mounted:sandbox

      - name: Run mounted Wallet transaction detail refresh in TEST
        run: bun run test:wallet-detail-refresh-mounted:test

      - name: Run mounted Wallet operation filters and refresh in SANDBOX
        run: bun run test:wallet-operation-filters-refresh:sandbox

      - name: Run mounted Wallet operation filters and refresh in TEST
        run: bun run test:wallet-operation-filters-refresh:test

      - name: Run mounted Card history page safety in SANDBOX
        run: bun run test:card-history-page:sandbox

      - name: Run mounted Card history page safety in TEST
        run: bun run test:card-history-page:test

      - name: Run mounted Card list-to-History selection safety in SANDBOX
        run: bun run test:card-history-selection:sandbox

      - name: Run mounted Card list-to-History selection safety in TEST
        run: bun run test:card-history-selection:test

      - name: Run mounted Card transaction detail refresh in SANDBOX
        run: bun run test:card-detail-refresh-mounted:sandbox

      - name: Run mounted Card transaction detail refresh in TEST
        run: bun run test:card-detail-refresh-mounted:test

      - name: Run mounted KYC status safety in SANDBOX
        run: bun run test:kyc-status-mounted:sandbox

      - name: Run mounted KYC status safety in TEST
        run: bun run test:kyc-status-mounted:test

      - name: Run mounted Virtual Card ownership confirmation in SANDBOX
        run: bun run test:virtual-card-mounted:sandbox

      - name: Run mounted Virtual Card ownership confirmation in TEST
        run: bun run test:virtual-card-mounted:test

      - name: Run mounted selected Card limits update safety in SANDBOX
        run: bun run test:card-limits-mounted:sandbox

      - name: Run mounted selected Card limits update safety in TEST
        run: bun run test:card-limits-mounted:test

      - name: Run mounted selected Card freeze/unfreeze safety in SANDBOX
        run: bun run test:card-status-mounted:sandbox

      - name: Run mounted selected Card freeze/unfreeze safety in TEST
        run: bun run test:card-status-mounted:test

      - name: Run mounted selected Card renewal safety in SANDBOX
        run: bun run test:card-renew-mounted:sandbox

      - name: Run mounted selected Card renewal safety in TEST
        run: bun run test:card-renew-mounted:test

      - name: Run mounted selected Card replacement safety in SANDBOX
        run: bun run test:card-replace-mounted:sandbox

      - name: Run mounted selected Card replacement safety in TEST
        run: bun run test:card-replace-mounted:test

      - name: Type check
        run: bunx tsc --noEmit

      - name: Lint
        run: bun run lint

      - name: Verify public wallet contract
        run: bun run audit:production

      - name: Build non-production artifact
        run: bun run build

      - name: Record immutable non-production evidence
        shell: bash
        run: |
          set -euo pipefail
          printf '{"format":"fastlink-prime-wallet-operation-evidence-v3","sourceCommit":"%s","environment":"NON_PRODUCTION","productionEnabled":false,"methods":["GET"],"filters":["type","status"],"cursorContract":"backend-v2-filter-bound","cursorHistory":"reject-replay-and-rollback","scope":["actor","session-expiry","session-object-generation","tenant","customer","environment","all-owned-accounts"],"manualRefresh":true,"sessionInvalidationPrimitive":"exact-session-object-identity","authoritativeInvalidationReasons":["EXPLICIT_401","EXPIRED","REVOKED","DISABLED","ENVIRONMENT_MISMATCH"],"retainedSessionFailures":["408","429","500-599","MODULE_FAILURE"],"authorizationPolicy":"current-401-invalidates-matching-session-current-403-404-clear-snapshot-408-429-5xx-module-failure-retain-session","validatedEnvironments":["SANDBOX","TEST"]}\n' "${{ github.event.pull_request.head.sha }}" > wallet-operation-evidence.json
          printf '{"format":"fastlink-prime-wallet-pr-evidence-v30","sourceCommit":"%s","environment":"NON_PRODUCTION","productionEnabled":false,"mutationEnvironments":["SANDBOX","TEST"],"manualReadEnvironments":["SANDBOX","TEST"],"integrationEnvironments":["SANDBOX","TEST"],"cardTransactionDetailCompletionGuard":"live-session-scope-revalidated-before-success-error-finally","integrationSuites":["src/lib/wallet-transfer-status-refresh.integration.ts","src/lib/card-transaction-history.integration.ts","src/lib/wallet-transfer-consumer.integration.ts"],"hookSafetySuites":["src/hooks/use-card-transaction-pages.test.tsx","src/hooks/use-card-transaction-detail.test.tsx","src/routes/transfer.mounted-safety.test.tsx","src/hooks/use-wallet-account-history.test.tsx","src/hooks/use-wallet-transaction-detail-refresh.test.tsx"],"mountedPageSafetySuites":["src/routes/history.mounted-pagination.test.tsx","src/routes/-history.mounted-selection.test.tsx","src/routes/history.mounted-detail-refresh.test.tsx","src/routes/-assets-fiat.mounted-refresh-selection.test.tsx","src/routes/-cards.mounted-virtual-create.test.tsx"],"mountedMutationSafetySuites":["src/routes/-cards.mounted-virtual-create.test.tsx#Mounted selected Card limits update","src/routes/-cards.mounted-virtual-create.test.tsx#Mounted selected Card freeze and unfreeze","src/routes/-cards.mounted-virtual-create.test.tsx#Mounted selected Card renewal","src/routes/-cards.mounted-virtual-create.test.tsx#Mounted selected Card replacement"],"mountedPageSafetyEnvironments":["SANDBOX","TEST"],"adversarialMatrices":["src/lib/card-read-adversarial.test.ts","src/lib/wallet-operation-adversarial.test.ts","src/lib/card-transaction-adversarial.test.ts","src/lib/card-transaction-pagination-adversarial.test.ts","src/lib/card-transaction-detail-refresh-adversarial.test.ts","src/lib/virtual-card-create-adversarial.test.ts","src/lib/card-renew-adversarial.test.ts","src/lib/card-replace-adversarial.test.ts","src/lib/card-limits-mutation-adversarial.test.ts","src/lib/card-status-mutation-adversarial.test.ts","src/lib/wallet-transfer-mutation-adversarial.test.ts","src/lib/wallet-transfer-account-state.test.ts","src/lib/wallet-transfer-status-refresh-adversarial.test.ts","src/lib/wallet-balance-summary-adversarial.test.ts","src/lib/wallet-transaction-filter-adversarial.test.ts","src/lib/wallet-transaction-refresh-adversarial.test.ts","src/lib/wallet-transaction-selection-adversarial.test.ts","src/lib/wallet-transaction-detail-refresh-adversarial.test.ts"]}\n' "${{ github.event.pull_request.head.sha }}" > build-evidence.json
          sha256sum build-evidence.json src/lib/card-read-adversarial.test.ts src/lib/wallet-operation-adversarial.test.ts src/lib/card-transaction-adversarial.test.ts src/lib/card-transaction-pagination-adversarial.test.ts src/lib/card-transaction-detail-refresh-adversarial.test.ts src/lib/card-transaction-detail-state.ts src/lib/card-transaction-detail-state.test.ts src/lib/virtual-card-create-adversarial.test.ts src/lib/card-renew-adversarial.test.ts src/lib/card-replace-adversarial.test.ts src/lib/card-limits-mutation-adversarial.test.ts src/lib/card-status-mutation-adversarial.test.ts src/lib/wallet-transfer-mutation-adversarial.test.ts src/lib/wallet-transfer-account-state.test.ts src/lib/wallet-transfer-status-refresh-adversarial.test.ts src/lib/wallet-balance-summary-adversarial.test.ts src/lib/wallet-transaction-filter-adversarial.test.ts src/lib/wallet-transaction-refresh-adversarial.test.ts src/lib/wallet-transaction-selection-adversarial.test.ts src/lib/wallet-transaction-detail-refresh-adversarial.test.ts src/lib/wallet-transfer-status-refresh.integration.ts src/lib/card-transaction-history.integration.ts src/lib/wallet-transfer-consumer.integration.ts src/lib/backend-api.ts src/hooks/use-card-list-pages.ts src/hooks/use-virtual-card-create.ts src/hooks/use-card-renew.ts src/hooks/use-card-replace.ts src/hooks/use-card-limits-mutation.ts src/hooks/use-card-status-mutation.ts src/hooks/use-card-transaction-pages.ts src/hooks/use-card-transaction-pages.test.tsx src/hooks/use-card-transaction-detail.ts src/hooks/use-card-transaction-detail.test.tsx src/hooks/use-wallet-account-history.ts src/hooks/use-wallet-account-history.test.tsx src/hooks/use-wallet-transaction-detail.ts src/hooks/use-wallet-transaction-detail-refresh.test.tsx src/lib/wallet-transaction-state.ts src/lib/wallet-transaction-selection-state.ts src/lib/wallet-transaction-detail-state.ts src/lib/wallet-transaction-detail-state.test.ts src/routes/assets.fiat.tsx src/routes/-assets-fiat.mount