name: Deploy Prime Wallet Dev to Cloudflare

# Development-only deployment. main and Production remain frozen.
on:
  workflow_dispatch:
    inputs:
      approved_sha:
        description: 'Full dev commit SHA approved for SANDBOX deployment after TEST verification'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fastlink-prime-wallet-dev
  cancel-in-progress: false

jobs:
  build-and-deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    environment: cloudflare-prime-dev
    env:
      VITE_FASTLINK_API_URL: /api
      VITE_FASTLINK_ENVIRONMENT: SANDBOX
      VITE_FASTLINK_BUILD_SHA: ${{ github.sha }}
    steps:
      - name: Verify approved deployment snapshot
        shell: bash
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
        run: |
          set -euo pipefail
          [[ "$APPROVED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$APPROVED_SHA" = "$GITHUB_SHA"

      - name: Checkout exact Dev commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Verify production wallet contract
        run: bun run audit:production

      - name: Build Cloudflare worker
        run: bun run build

      - name: Deploy dev worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.114.0"
          command: deploy --config wrangler.dev.jsonc

      - name: Verify deployed Prime Wallet Dev
        shell: bash
        run: |
          set -euo pipefail
          base='https://fastlink-prime-wallet-dev.xw1134315560.workers.dev'
          node scripts/verify-prime-wallet-readiness.mjs "$base" SANDBOX "${{ github.sha }}"
